<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b50">
  <title>ออฟไลน์ — Dorm Happy Hub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f5fa;color:#173456;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,440px);padding:36px 28px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 16px 48px #17345612}
    .icon{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 20px;border-radius:22px;background:#102b50;color:#fff;font-size:34px}
    h1{margin:0 0 12px;font-size:22px}p{line-height:1.7;color:#64748b;font-size:14px}
    button{margin-top:16px;border:0;border-radius:12px;background:#1d3b64;color:#fff;padding:12px 22px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="icon">⌂</div>
    <h1>ขณะนี้คุณออฟไลน์</h1>
    <p>Dorm Happy Hub ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อโหลดข้อมูลห้องพัก ผู้เช่า และการชำระเงิน กรุณาตรวจสอบเครือข่ายแล้วลองอีกครั้ง</p>
    <button onclick="location.reload()">ลองเชื่อมต่ออีกครั้ง</button>
  </main>
</body>
</html>
